[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "absa-depth"
version = "0.1.0"
description = "Adaptive-depth valence-arousal aspect sentiment research"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "transformers>=4.40,<5", "numpy>=1.24"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
